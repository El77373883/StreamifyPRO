
name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6.0'

      - name: Verificar Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen

      - name: Generar proyecto
        run: |
          xcodegen generate

      - name: Limpiar compilación anterior
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build
          rm -rf Payload
          rm -f Streamify.ipa

      - name: Verificar esquema
        run: |
          xcodebuild -list -project Streamify.xcodeproj

      - name: Compilar Streamify sin firma
        run: |
          set -o pipefail

          xcodebuild \
            -project Streamify.xcodeproj \
            -scheme Streamify \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verificar aplicación
        run: |
          test -d build/Build/Products/Release-iphoneos/Streamify.app
          echo "Streamify.app generado correctamente"

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Streamify.app Payload/
          /usr/bin/zip -r Streamify.ipa Payload

      - name: Verificar IPA
        run: |
          test -f Streamify.ipa
          unzip -l Streamify.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-ipa
          path: Streamify.ipa
          if-no-files-found: error
