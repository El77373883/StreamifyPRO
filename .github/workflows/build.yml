name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 👇 ESTA ACCIÓN OFICIAL SELECCIONA XCODE 16.4 SIN FALLAR
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Limpiar Caché
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build

      - name: Compilar sin firmar
        run: |
          xcodebuild -project Streamify.xcodeproj \
            -scheme Streamify \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Streamify.app Payload/
          zip -r Streamify.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-ipa
          path: Streamify.ipa
