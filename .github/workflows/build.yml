
name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Limpiar compilación
        run: |
          rm -rf build
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Compilar aplicación
        run: |
          xcodebuild \
            -project Streamify.xcodeproj \
            -scheme Streamify \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Streamify.app Payload/
          zip -r Streamify.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-ipa
          path: Streamify.ipa
