name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 👇 SELECCIÓN DINÁMICA DE XCODE (BUSCA EL 16)
      - name: Seleccionar Xcode (Dinámico)
        run: |
          # Busca la primera versión de Xcode 16 que encuentre en el sistema
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Seleccionando: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "No se encontró Xcode 16, usando el predeterminado"
          fi
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      # 👇 LIMPIAMOS CACHÉ PARA EVITAR ERRORES DE COMPILACIÓN
      - name: Limpiar Caché
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build

      - name: Compilar sin firmar
        run: |
          xcodebuild -project Streamify.xcodeproj \
            -scheme Streamify \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Streamify.app Payload/
          zip -r Streamify.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-ipa
          path: Streamify.ipa
