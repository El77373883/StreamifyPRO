name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Intentar usar Xcode 16.4, si no, usa el default sin fallar
      - name: Seleccionar Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
            echo "Usando Xcode 16.4"
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
            echo "Usando Xcode 16.3"
          else
            echo "No se encontró Xcode 16.x, usando el predeterminado del sistema"
          fi
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Limpiar Caché
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build

      - name: Compilar sin firmar
        run: |
          xcodebuild -project Streamify.xcodeproj \
            -scheme Streamify \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Streamify.app Payload/
          zip -r Streamify.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-ipa
          path: Streamify.ipa
